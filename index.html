<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mokuro</title>

    <link rel="stylesheet" href="style.css?v=3">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E3A5F">
    <link rel="icon" href="favicon.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body>


<header>

<div id="accountArea">

    <!-- 未ログイン時 -->
   <button id="loginButton" onclick="loginGoogle()" style="display: none;">
    ログイン
</button>


    <!-- ログイン後（初期状態は display: none にしておく） -->
    <div id="userArea" style="display: none;">

        <button id="accountButton">
            <img id="userPhoto" alt="ユーザーアイコン">
        </button>

        
    </div>

</div>




<div id="userDropdown" class="dropdown hidden">
    <div class="user-info">
        <strong id="dropdownName"></strong>
        <small id="dropdownEmail"></small>
    </div>

    <hr>

    <button onclick="logout()">
        ログアウト
    </button>
</div>

<h1>Mokuro</h1>

        <button id="settingButton" onclick="openSettings()" class="icon-button">
            <i data-lucide="settings"></i>
        </button>

</header>


<p>触れた作品を記録する目録</p>



<!-- 検索・絞り込み -->



<div class="section" id="searchForm">

    <h2>検索・絞り込み</h2>


    <label for="search">検索</label>

    <input
    type="text"
    id="search"
    placeholder="作品名・メモを検索"
    oninput="updateList()">




    <label for="filterCategory">分類</label>

    <select
    id="filterCategory"
    onchange="updateList()">

        <option value="">すべて</option>
        <option>漫画</option>
        <option>書籍</option>
        <option>アニメ</option>
        <option>映画</option>
        <option>ゲーム</option>
        <option>音楽</option>
        <option>成人向け</option>
        <option>その他</option>

    </select>
    <label for="sort">並び替え</label>

    <select id="sort" onchange="updateList()">
    <option value="new">新しい順</option>
    <option value="old">古い順</option>
    <option value="name">作品名順</option>
    </select>



    </div>



    

  


<!-- 作品追加 -->


<button id="fab" onclick="toggleAddForm()">
    <i data-lucide="plus"></i>
</button>
<div class="section" id="addForm">







    <h2>作品を追加</h2>


    <label for="title">作品名</label>

    <input
        type="text"
        id="title"
        oninput="checkForm()">



    <label for="category">分類</label>

    <select
        id="category"
        onchange="checkForm()">

        <option value="">分類を選択</option>
        <option>漫画</option>
        <option>書籍</option>
        <option>アニメ</option>
        <option>映画</option>
        <option>ゲーム</option>
        <option>音楽</option>
        <option>成人向け</option>
        <option>その他</option>

    </select>




    <label for="status">状態</label>

    <select id="status">

        <option value="">未選択</option>
        <option>未開始</option>
        <option>プレイ中</option>
        <option>視聴中</option>
        <option>読書中</option>
        <option>クリア済み</option>
        <option>視聴済み</option>
        <option>読了</option>

    </select>




    <label for="date">日付</label>

<div class="date-wrapper">
    <input type="date" id="date">
</div>

   



    <label for="memo">メモ</label>

    <textarea
        id="memo"></textarea>

        



<!--追加キャンセルボタン-->
    <div class="form-buttons">

        <button 
        id="addButton" 
        onclick="addWork()" 
        disabled>
        追加
     </button>

     <button 
        id="cancelButton" 
        onclick="cancelEdit()" 
        style="display:none;">
        キャンセル
     </button>

</div>
</div>






<!-- 一覧 -->
<div class="list-header">

    <h2>作品一覧</h2>

    <!--検索欄を開くボタン-->
<button id="searchButton" onclick="toggleSearchForm()">
    <svg 
        width="24" 
        height="24" 
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>

    </svg>
</button>

</div>

<div id="workList"></div>






<div id="overlay" onclick="closeSettings()"></div>

<div id="settingsSheet">

    <div class="sheet-handle"></div>

    <h2>設定</h2>

    <button onclick="exportWorks()">
        データを書き出す
    </button>
    <input type="file" id="importFile" accept=".json" hidden onchange="loadWorks(event)">
    <button onclick="importWorks()">
    データを読み込む
</button>



    <button onclick="closeSettings()">
        閉じる
    </button>

</div>

<!-- 削除確認ダイアログ -->
<div id="deleteOverlay" onclick="closeDeleteDialog()"></div>

<div id="deleteDialog">
    
    <p id="deleteDialogTitle"></p>
    
    <div class="dialog-buttons">
        <button id="deleteCancelButton" onclick="closeDeleteDialog()">
            キャンセル
        </button>
        <button id="deleteConfirmButton" onclick="confirmDelete()">
            削除
        </button>
    </div>
</div>






<script type="module" src="script.js"></script>



</body>

</html>
